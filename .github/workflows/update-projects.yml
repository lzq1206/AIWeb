name: Refresh AIWeb catalog

on:
  schedule:
    # Every three hours, offset from the hour to avoid a burst with other jobs.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aiweb-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch a paced batch from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_vibecodes.py

      - name: Commit catalog changes
        shell: bash
        run: |
          if git diff --quiet -- data/projects.json data/fetch-state.json; then
            echo "No catalog changes to commit; the current catalog will still be published."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/projects.json data/fetch-state.json
            git commit -m "chore: refresh AIWeb catalog"
            git push
          fi

      # GITHUB_TOKEN pushes do not trigger a second workflow. Publish here so
      # the scheduled fetch and the Pages deploy remain one reliable daily job.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload latest site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy latest catalog to Pages
        id: deployment
        uses: actions/deploy-pages@v4
