name: Refresh AIWeb catalog

on:
  schedule:
    # Daily, offset from the hour to avoid a burst with other scheduled jobs.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aiweb-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch a paced batch from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_vibecodes.py

      - name: Commit catalog changes
        shell: bash
        run: |
          if git diff --quiet -- data/projects.json data/fetch-state.json; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json data/fetch-state.json
          git commit -m "chore: refresh AIWeb catalog"
          git push

