<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#081018" />
    <meta name="description" content="AIWeb：发现 GitHub 上值得打开的开源小项目。" />
    <title>AIWeb · Vibe Radar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="AIWeb 首页">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>AIWeb</span>
        </a>
        <div class="topbar-note"><span class="live-dot" aria-hidden="true"></span>每 3 小时更新一次</div>
        <nav class="topnav" aria-label="主导航">
          <a class="active" href="#feed">发现</a>
          <button id="nav-favorites" type="button">我的收藏 <span id="favorite-count">0</span></button>
        </nav>
        <a class="github-link" href="https://github.com/lzq1206/AIWeb" target="_blank" rel="noreferrer">GitHub <span aria-hidden="true">↗</span></a>
      </header>

      <main id="feed">
        <section class="intro" aria-labelledby="page-title">
          <div class="intro-copy">
            <h1 id="page-title">把热门的 AI 小项目，变成你的灵感库。</h1>
          </div>
        </section>

        <section class="controls" aria-label="筛选与排序">
          <div class="control-heading">
            <div>
              <p class="section-kicker">LATEST PROJECTS</p>
              <h2>今日值得打开的仓库</h2>
            </div>
            <span class="result-count" id="result-count">正在同步…</span>
          </div>
          <div class="control-row">
            <label class="search-box">
              <span class="search-icon" aria-hidden="true">⌕</span>
              <input id="search-input" type="search" placeholder="搜索项目、标签或作者" autocomplete="off" />
              <kbd>/</kbd>
            </label>
            <div class="sort-buttons" aria-label="排序方式">
              <button class="sort-button active" type="button" data-sort="hot">最热</button>
              <button class="sort-button" type="button" data-sort="new">最新</button>
              <button class="sort-button" type="button" data-sort="saved">已收藏</button>
            </div>
          </div>
          <div class="tag-row" id="tag-row" aria-label="项目分类">
            <button class="tag-filter active" type="button" data-tag="全部">全部</button>
            <button class="tag-filter" type="button" data-tag="AI Tool">AI Tool</button>
            <button class="tag-filter" type="button" data-tag="UI / Design">UI / Design</button>
            <button class="tag-filter" type="button" data-tag="Agent">Agent</button>
            <button class="tag-filter" type="button" data-tag="Vibe Coding">Vibe Coding</button>
          </div>
        </section>

        <section class="project-grid" id="project-grid" aria-live="polite" aria-label="项目瀑布流"></section>
        <section class="empty-state" id="empty-state" hidden>
          <div class="empty-icon" aria-hidden="true">⌁</div>
          <h2>这组信号暂时为空</h2>
          <p>试试换一个关键词或清除筛选。</p>
          <button class="ghost-button" id="clear-filters" type="button">清除筛选</button>
        </section>
      </main>

      <footer class="site-footer">
        <div><span class="brand-mark small" aria-hidden="true">✦</span><span>AIWeb / Vibe Radar</span></div>
        <p>数据来自 GitHub 公共 API · 每 3 小时分批更新 · 开源项目请以原仓库为准</p>
      </footer>
    </div>

    <dialog class="comments-dialog" id="comments-dialog" aria-labelledby="comments-title">
      <div class="dialog-head">
        <div>
          <p class="section-kicker">COMMUNITY THREAD</p>
          <h2 id="comments-title">项目讨论</h2>
        </div>
        <button class="close-button" id="close-comments" type="button" aria-label="关闭评论">×</button>
      </div>
      <p class="dialog-caption" id="comments-caption">评论会通过 GitHub Issues 保存，登录 GitHub 后即可参与。</p>
      <div id="utterances-host" class="utterances-host"></div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
